# STEP 2: 定番の CI。チェックアウト → Node セットアップ → lint → テスト
# matrix で Node のバージョンを複数同時にテストする
name: 02 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]
    steps:
      - name: ソースを取得
        uses: actions/checkout@v4

      - name: Node.js ${{ matrix.node-version }} をセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: lint
        run: npm run lint

      - name: テスト
        run: npm test
